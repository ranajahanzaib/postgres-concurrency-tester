[package]
name = "postgres-concurrency-tester"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Controlled PostgreSQL concurrency experiments"
repository = "https://github.com/ranajahanzaib/postgres-concurrency-tester"
readme = "README.md"
keywords = ["postgresql", "benchmarking", "performance", "database"]
categories = ["command-line-utilities", "database"]
exclude = ["PLAN.md"]

[dependencies]
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
hdrhistogram = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal", "net", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4", "serde"] }

